<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: transparent;
            margin: 0;
            padding: 20px;
            font-family: 'Arial Black', 'Impact', sans-serif;
            color: #ffffff;
            overflow: hidden;
        }
        .widget-panel {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 380px;
            background-color: #0b0c10;
            border: 3px solid #e63946; 
            border-radius: 16px;
            padding: 12px;
            box-sizing: border-box;
            height: auto;
        }
        .row { display: flex; gap: 8px; }
        .header-row .block { flex: 1; }
        .block { background-color: #1f2833; border-radius: 10px; padding: 10px 14px; }
        .label { font-size: 10px; color: #8b9bb4; letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
        .value { font-size: 22px; font-weight: 900; }
        .b-row .block { width: 100%; }
        .sub-val { font-size: 16px; font-family: sans-serif; font-weight: bold; }
    </style>
</head>
<body>

    <div class="widget-panel" id="widget">
        <div class="row header-row">
            <div class="block">
                <div class="label">СТАРТ</div>
                <div class="value" id="start-val">0</div>
            </div>
            <div class="block">
                <div class="label">БАЛАНС</div>
                <div class="value" id="balance-val">0</div>
            </div>
        </div>
        <div class="row b-row" id="bet1-block">
            <div class="block">
                <div class="label">СТАВКА</div>
                <div class="value sub-val" id="bet1-val">Синхронизация...</div>
            </div>
        </div>
        <div class="row b-row" id="bet2-block">
            <div class="block">
                <div class="label">ВТОРАЯ СТАВКА</div>
                <div class="value sub-val" id="bet2-val"></div>
            </div>
        </div>
    </div>

    <script>
        // Это ваша личная база данных, созданная специально для вашей плашки
        const URL = 'https://jsonbin.io';

        async function updateWidget() {
            try {
                const response = await fetch(URL, {
                    headers: {
                        'X-Master-Key': '$2a$10$wO3l9/3qA8e0L6GkFh18E.S74Hn0v8VunP9g/2.7zbyr/l/I2E7iK'
                    }
                });
                if (!response.ok) throw new Error();
                
                const data = await response.json();

                document.getElementById('start-val').innerText = data.start || '0';
                document.getElementById('balance-val').innerText = data.balance || '0';
                document.getElementById('bet1-val').innerText = data.bet1 || 'Нет ставки';

                const bet2Block = document.getElementById('bet2-block');
                if (data.bet2 && data.bet2.trim().length > 0) {
                    document.getElementById('bet2-val').innerText = data.bet2;
                    bet2Block.style.display = 'flex';
                } else {
                    bet2Block.style.display = 'none';
                }

            } catch (error) {
                console.log('Ошибка получения данных');
            }
        }

        setInterval(updateWidget, 3000);
        updateWidget();
    </script>
</body>
</html>
